#If the user is Admin or Team Lead - he needs more access to resources than other team members
# But with this access he can only have access to namespaced level resources not Cluster level
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: roboshop
  name: roboshop-admin
rules:
- apiGroups: ["*"] # "" indicates the core API group -usually -deployments/rs/serv
  resources: ["*"]
  verbs: ["*"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: roboshop-admin
rules:
- apiGroups: ["storage.k8s.io"] 
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""] # "" indicates the core API group
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch"]
